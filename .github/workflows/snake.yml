# ============================================================
# Contribution Snake — Dark + Rainbow themes, auto-updates daily
#
# SETUP:
# 1. In the "Devil-Rick/Devil-Rick" repo, create the path:
#    .github/workflows/snake.yml  and paste this file's content in.
# 2. Go to repo Settings → Actions → General → Workflow permissions
#    → set to "Read and write permissions", then Save.
# 3. Commit. The action runs on push to main and once daily (cron),
#    and can also be triggered manually from the Actions tab.
# 4. It publishes the generated SVGs to a branch called "output",
#    which is what the README's <picture> tag points to.
# ============================================================

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Devil-Rick
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=#00F5FF&color_dots=#0D0221,#8B5CF6,#00F5FF,#FF00FF,#39FF14

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
